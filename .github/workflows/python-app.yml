name: SmartClinic+ CI

on:
  push:
    branches: ["main", "development"]
  pull_request:
    branches: ["main", "development"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartclinic
          POSTGRES_USER: smartclinic
          POSTGRES_PASSWORD: smartclinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smartclinic -d smartclinic"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests
        env:
          DATABASE_URL: postgresql+psycopg2://smartclinic:smartclinic@localhost:5432/smartclinic
        run: python -m pytest -v
